# One command: docker compose up
# DEV_MODE is ON here so reviewers can mint tokens via POST /dev/token.
# WARNING: never run with DEV_MODE=true in production.
services:
  api:
    build:
      context: .
      args:
        CLASSIC_TLS: ${CLASSIC_TLS:-0}   # optional build workaround, off by default (README, Troubleshooting)
    image: commute-policy-assistant:dev
    ports:
      - "8000:8000"
    env_file:
      - path: .env          # optional: add GROQ_API_KEY here for real answers
        required: false
    environment:
      DEV_MODE: "true"
      DATA_DIR: /data
    volumes:
      - app-data:/data
      - ./eval/results:/app/eval/results   # eval output visible on the host
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 6

volumes:
  app-data:
